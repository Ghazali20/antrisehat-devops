services:
  db:
    image: mysql:8.0
    container_name: antrisehat-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-antrisehat}
      MYSQL_USER: ${DB_USERNAME:-antrisehat_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - antrisehat-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: ${DOCKERHUB_IMAGE:-rafliriandraa/antrisehat:latest}
    build:
      context: .
      target: production
    container_name: antrisehat-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - antrisehat-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    image: ${DOCKERHUB_IMAGE:-rafliriandraa/antrisehat:latest}
    container_name: antrisehat-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - antrisehat-net
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Scheduler Reset Antrean Harian AntriSehat aktif..."
        while true; do
          CURRENT_TIME=$$(date +%H:%M)
          if [ "$$CURRENT_TIME" = "00:00" ]; then
            php artisan queue:reset-daily
            sleep 65
          fi
          sleep 20
        done

networks:
  antrisehat-net:
    driver: bridge

volumes:
  mysql_data:
